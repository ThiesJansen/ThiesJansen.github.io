baseURL: "https://hugo-profile.netlify.app"
languageCode: "en-us"
title: "Hugo Profile"
theme: hugo-profile

defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false


outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

menu:
  main:
    - identifier: posts
      name: Posts
      title: Blog posts
      url: /posts
      weight: 1
    - identifier: Publications
      name: Publications
      title: Publications
      url: /publications
      weight: 1


markup:
  goldmark:
    renderer:
      unsafe: true


params:
  color:
    textColor: "#14213d" #textcolor color of all bodies, menu buttons, hero subtitle, intro and content (Dark)
    secondaryTextColor: "#000000" #textcolor of headings (Dark)
    
    primaryColor: "#1982c4" #color of title hero = 'Welcome', Name on top left, small accents, hoover (pop)
    textLinkColor: "#1982c4" #color of links, same as primary color
    
    backgroundColor: "#faf9f9" #background color (light)
    secondaryColor: "#ffffff" #background color of cards, border picture (light)



  navbar:
    align: ms-auto # Left: ms-auto | center: mx-auto | right: me-auto | Default: ms-auto
    # brandLogo: "/logo.png" # Logo for the brand | default is the favicon variable
    showBrandLogo: false # Show brand logo in nav bar | default is true
    brandName: "Thies Jansen" # Brand name for the brand | default is the title variable
    disableSearch: true
    # searchPlaceholder: "Search"
    stickyNavBar:
      enable : true
      showOnScrollUp : true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: false
      disableContact: false

  # HERO (this is what you're seeing correctly)
  hero:
    enable: true
    intro: "Hello, my name is Thies Jansen"
    title: "Welcome!"
    subtitle: "Here you find my latest updates on my researchs"
    content: I am a postdoctoral researcher at the Danish University of Technology (DTU) in the Functional Oxides (FOX) group. My research focuses on developing nanoelectronic devices based on oxides and semiconductor-superconductor hybrids to explore novel physical phenomena through transport measurements at millikelvin temperatures. 
    image: "/images/1-49_cropped.jpg"
    bottomImage:
      enable: false
    button:
      enable: true
      name: "Resume"
      url: "/files/Thies Jansen curriculium vitea.pdf"
      download: true

  about:
    enable: false
    title: "About Me"
    image: "/images/1-49_cropped"
    content: |-
      I am a postdoctoral researcher at the Danish University of Technology (DTU) in the Functional Oxides (FOX) group. My research focuses on developing nanoelectronic devices based on oxides and semiconductor-superconductor hybrids to explore novel physical phenomena through transport measurements at millikelvin temperatures. 
    skills:
      enable: false
      title: "Here are a few technologies I've been working with recently:"
      items:
        - "HTML"
        - "CSS"
        - "JavaScript"
        - "React"
        - "Node"
        - "Express"

  singlePages:
    socialShare: false   # removes social icons
    scrollprogress:
      enable: false      # optional: removes scroll bar
    readTime:
      enable: false      # optional
  
  
  favicon: "icons/iconTJ.png"


  footer:
    recentPosts:
      path: "posts"
      count: 6
      title: "Recent Posts"
      enable: true
      disableFeaturedImage: false

    socialNetworks:
      github: https://github.com/ThiesJansen
      linkedin: https://www.linkedin.com/in/thies-jansen-334b5480/?skipRedirect=true
      customIcons:
        - icon: /icons/strava.png
          url: https://www.strava.com/athletes/16012637
          tooltip: Strava


      